<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONCE — Worn by me, found by you.</title>
<meta name="description" content="ONCE — Worn by me, found by you. ของในตู้ที่อยากให้ได้ไปอยู่กับคนใหม่ (FROM MY CLOSET · SECOND ROUND · NO TWO STORIES ALIKE)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo" onclick="go('shop')">
    <span class="logo-mark">ONCE</span>
    <span class="logo-sub">1-OF-1 ARCHIVE</span>
  </div>
  <nav id="nav"></nav>
  <button id="cartBtn" class="cart-btn" onclick="toggleCart()">BAG • <span id="cc">0</span></button>
</header>
<main id="app"></main>
<aside id="drawer">
  <div class="row">
    <div>
      <h2 style="margin:0;font-family:var(--font-head);letter-spacing:.05em">YOUR BAG</h2>
      <div class="mut" style="font-size:11px">1-OF-1 PIECES • ไม่มีการเติมสต็อก</div>
    </div>
    <button class="btn-icon" onclick="toggleCart()">✕</button>
  </div>
  <div id="cl"></div>
  <div class="row" style="margin-top:auto;border-top:1px solid var(--line);padding-top:12px">
    <b>ยอดรวม</b>
    <span class="price" id="ct"></span>
  </div>
  <button class="pri" style="width:100%;margin-top:10px" onclick="toggleCart();go('checkout')">ดำเนินการชำระเงิน →</button>
</aside>
<div id="toast"></div>

<!-- Slip Modal -->
<div id="slipModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeSlipModal()">
  <div class="modal-card">
    <div class="row"><h3 style="margin:0">📄 หลักฐานการชำระเงิน</h3><button class="btn-icon" onclick="closeSlipModal()">✕</button></div>
    <div id="slipModalBody" style="margin-top:14px;text-align:center"></div>
  </div>
</div>

<!-- Receipt Modal -->
<div id="receiptModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeReceiptModal()">
  <div class="modal-card receipt-card">
    <div class="row" style="margin-bottom:12px">
      <h3 style="margin:0">🧾 ใบเสร็จรับเงิน (E-Receipt)</h3>
      <div style="display:flex;gap:6px">
        <button class="pri btn-sm" onclick="printReceipt()">🖨️ พิมพ์ / PDF</button>
        <button class="btn-icon" onclick="closeReceiptModal()">✕</button>
      </div>
    </div>
    <div id="receiptBody"></div>
  </div>
</div>

<!-- Customer Chat Widget -->
<div id="chatWidget" class="chat-widget">
  <button id="chatToggleBtn" class="chat-toggle-btn" onclick="toggleChat()">
    <span class="chat-icon">💬</span>
    <span class="chat-label">คุยกับร้าน</span>
    <span id="chatBadge" class="chat-badge" style="display:none">0</span>
  </button>
  <div id="chatBox" class="chat-box" style="display:none">
    <div class="chat-header">
      <div class="chat-title-wrap">
        <div class="chat-avatar">O</div>
        <div>
          <div class="chat-title">ONCE Concierge</div>
          <div class="chat-status"><span class="dot-online"></span> แอดมินออนไลน์</div>
        </div>
      </div>
      <button class="chat-close-btn" onclick="toggleChat()" title="ปิดหน้าต่างแชท">✕</button>
    </div>

    <div id="chatMsgList" class="chat-msg-list"></div>

    <div class="chat-input-row">
      <input id="chatInput" placeholder="พิมพ์ข้อความสอบถามไซส์/ขอรูปเพิ่ม…" onkeydown="if(event.key==='Enter')sendCustomerMsg()">
      <button class="pri" style="border-radius:999px;padding:8px 16px" onclick="sendCustomerMsg()">ส่ง</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
